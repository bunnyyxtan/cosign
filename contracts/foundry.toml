[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "london"   # Mezo docs recommend London; Morpho Blue is compiled for London here too
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "morpho-blue/=lib/morpho-blue/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"

[fuzz]
runs = 256

[lint]
# uint64 timestamp casts are safe for ~584 billion years
exclude_lints = ["unsafe-typecast"]
